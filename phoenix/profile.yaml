    - company: Kiefer Fund
      title: Portfolio Manager (launched the fund)
      period: 2020 – 2023
      summary: Mexican multi-family office focused on derivatives-hedged strategies; wound down in 2023 after not reaching target AUM.
      bullets:
        - Launched the fund and designed and managed its fiscal and legal partnership structure and compliance framework.
        - Programmed three Python algorithms that mechanically traded options on the main US equity indices; ran a book spanning equities to structured notes with rules-based, quantitative strategies.
        - Managed relationships with institutional investors, banks and brokers; co-led fundraising beyond the founding investors.
    - company: Goleta Fund
      title: Portfolio Manager
      period: 2017 – 2020
      bullets:
        - Managed two sub-funds across equities and alternative investments with a volatility-minimizing mandate, returning 11% and 13% annualized with Sharpe ratios above 1.0.
        - Led the creation of three US-based trust structures; administered the office's trust and legal structures and advised on fiscal and legal structuring.
    - company: Escala Partners
      title: Associate
      period: 2015 – 2017
      summary: Mexican multi-family office focused on private investments, US $100M AUM across 10+ companies.
      bullets:
        - Led structuring, financial modelling and fundraising for five Mexican oil-and-gas projects with deals of MXN 100M to 500M; managed relationships with key players in the Mexican energy sector.
        - Structured eight private investments in mid-market companies, from a Tier-1 automotive OEM supplier to a food and agriculture manufacturer.
        - Provided business and strategy consulting to the office's portfolio companies.
    - company: Grupo Bursátil Mexicano (GBM)
      title: Senior Financial Advisor
      period: 2014 – 2015
      bullets:
        - Portfolio construction and asset management for private clients at a Mexican investment bank and asset manager.
    - company: Kepler ERP
      title: Back-End Software Developer
      period: 2011 – 2020
      bullets:
        - Engineered back-end components in Python, C++, C# and Java for a mid-market financial ERP, improving performance and scalability of accounting and business operations.
