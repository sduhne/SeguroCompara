    Director of AI and business consulting at Menlo Capital, with ten years managing money for
    Mexican multi-family offices (portfolio manager at Goleta Fund, US $50M AUM; launched and ran
    Kiefer Fund) and a computer-science background (nine years building financial ERP back-ends in
    Python, C#, C++ and Java; wrote the Python algorithms that traded options on US indices).
    Combines a finance operator's discipline with hands-on AI delivery: where AI pays, the business
    case, and pilots to production.
  experience:
    - company: Menlo Capital
      title: Director, AI & Business Consulting
      period: 2024 – Present   # SET ME: confirm start date
      summary: Investment and advisory firm with an AI and business consulting practice.
      bullets:
        - "Lead the AI and business consulting practice: scope engagements, build the business case for each AI investment, and run delivery from pilot to production alongside the client's operating team."
        - "Advise executives on where AI changes unit economics: use-case selection, build-versus-buy decisions, vendor evaluation, data readiness and governance."
        - "Bring the finance lens to every engagement: financial models, ROI tracking and board-level reporting on AI programs."
    - company: Goleta Fund
      title: Portfolio Manager, Family Office Manager
      period: 2023 – 2024
      summary: Mexican multi-family office focused on alternative investments, US $50M AUM.
      bullets:
        - Ran two low-volatility strategies across public asset classes, from equities to futures, returning 7% and 9% annualized with Sharpe ratios above 1.10.
