# Screening questions Phoenix answers from here before asking Claude. Add the ones you see often.
qa_bank:
  - q: Why are you interested in this role?
    a: "The role sits where my two careers meet: ten years running money and structures for family offices, and hands-on AI delivery at Menlo Capital. I want work where a finance operator who can read the code decides what AI is worth building."
  - q: Describe your experience with AI or machine learning.
    a: At Menlo Capital I lead the AI and business consulting practice, from use-case selection and ROI cases to getting pilots into production. Before that I programmed the Python options-trading algorithms for Kiefer Fund and spent nine years building financial ERP back-ends in Python, C#, C++ and Java.
  - q: How many years of experience do you have in finance?
    a: Ten years in investment management and finance, including portfolio management at Goleta Fund (US $50M AUM), launching Kiefer Fund, and deal structuring at Escala Partners.
  - q: Have you managed a P&L or budget?
    a: Yes. As portfolio manager I ran two sub-funds and later two low-volatility strategies at Goleta Fund, and I launched and ran Kiefer Fund end to end, including its legal, fiscal and compliance framework.
  - q: Are you comfortable working as a contractor?
    a: Yes. I work with US and European companies as an independent contractor or through an employer of record such as Deel or Remote.
  - q: What time zone are you in and what overlap can you offer?
    a: Mexico City, Central Time (UTC-6). Full overlap with US business hours and four to six hours with European mornings and afternoons.
  - q: What is your English proficiency?
    a: Fluent. I studied international business in Germany in English, completed Columbia Business School executive education, and work daily with US counterparts. Spanish is my native language.
  - q: Are you open to part-time or fractional work?
    a: Yes. I am open to full-time, part-time and fractional or advisory engagements.
  - q: Do you have the right to work in the EU?
    a: Yes. I hold a German passport, so I can work anywhere in the EU and EEA without sponsorship.
  - q: Are you authorized to work in the United States?
    a: No. I work with US companies as an independent contractor or through an employer of record such as Deel or Remote; a US employee role would need sponsorship.

